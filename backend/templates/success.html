{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SecureAuth — Email verified</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="bg-decor" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<main class="page">
  <div class="page-inner">

    <section class="card">

      <div class="logo-wrap">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>
            <rect x="9" y="11" width="6" height="5" rx="1"/>
            <path d="M10.5 11V9a1.5 1.5 0 0 1 3 0v2"/>
          </svg>
        </div>
        <div class="logo-text"><span class="secure">Secure</span><span class="auth">Auth</span></div>
      </div>

      <div class="success-icon-wrap" role="img" aria-label="Email verified successfully">
        <div class="ring" aria-hidden="true"></div>
        <div class="circle">
          <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </div>
      </div>

      <h1 class="title">Email verified successfully</h1>
      <p class="subtitle">Your email address has been verified.<br />You are now authenticated.</p>

      <button type="button" class="btn btn-success" id="continueBtn" aria-label="Continue">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
        </svg>
        <span class="btn-label">Continue</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <button type="button" class="btn btn-outline" id="homeBtn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/>
        </svg>
        <span class="btn-label">Back to home</span>
      </button>

    </section>

    <p class="site-footer">Secure authentication • Privacy focused</p>

  </div>
</main>

<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
